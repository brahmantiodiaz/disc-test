<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Result Page</title>
    <!-- Favicon standard -->
    <link rel="icon" href="./asset/favicon.ico" />

    <!-- PNG favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./asset/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./asset/favicon-16x16.png"
    />

    <!-- Android Chrome -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./asset/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./asset/android-chrome-512x512.png"
    />

    <!-- Apple (iPhone/iPad) -->
    <link rel="apple-touch-icon" href="./asset/apple-touch-icon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="py-4 py-md-5">
      <div class="container">
        <div id="page-content">
          <div class="row g-4">
            <div class="col-12">
              <div id="profile-highlight" class="app-card p-4"></div>
            </div>
            <div class="col-12">
              <div class="app-card p-3 p-md-4">
                <h3 class="h5 mb-3">Ringkasan Score</h3>
                <div class="table-responsive">
                  <table class="table table-bordered text-center align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Line</th>
                        <th>D</th>
                        <th>I</th>
                        <th>S</th>
                        <th>C</th>
                        <th>*</th>
                        <th>Total</th>
                      </tr>
                    </thead>
                    <tbody id="resultTable"></tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="app-card p-3 p-md-4 h-100">
                <h3 class="h6 mb-3">Graph 1 • Most / Public Self</h3>
                <canvas id="firstChart" height="350"></canvas>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="app-card p-3 p-md-4 h-100">
                <h3 class="h6 mb-3">Graph 2 • Least / Core Self</h3>
                <canvas id="secondChart" height="350"></canvas>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="app-card p-3 p-md-4 h-100">
                <h3 class="h6 mb-3">Graph 3 • Change / Mirror Self</h3>
                <canvas id="thirdChart" height="350"></canvas>
              </div>
            </div>
            <div class="col-12">
              <div class="row g-4">
                <div class="col-lg-12">
                  <div id="profile-card" class="app-card result-card"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="footer"></div>

    <script src="./js/core/init.js" defer></script>
    <script src="./js/services/alertServices.js" defer></script>
    <script src="./js/services/localStorageServices.js" defer></script>
    <script src="./js/services/userServices.js" defer></script>
    <script src="./js/core/permission.js" defer></script>
    <script src="./js/components/navbar.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
    <script src="./js/components/questionCard.js" defer></script>
    <script src="./js/data/profile.js" defer></script>
    <script src="./js/data/question.js" defer></script>
    <script src="./js/helper/dummyParticipant.js" defer></script>
    <script src="./js/services/scoringService.js" defer></script>
    <script src="./js/services/participantServices.js" defer></script>
    <script src="./js/services/resultProfileService.js" defer></script>
    <script src="./js/pages/resultPage.js" defer></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
